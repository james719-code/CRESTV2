name: Android Release

on:
  push:
    tags:
      - "android-v*"
      # Existing Android release tags remain supported.
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Decode release inputs
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in SIGNING_KEY GOOGLE_SERVICES_JSON KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

          printf '%s' "${SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/release_key.jks"
          printf '%s' "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json

      - name: Test and build release APK
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release_key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "android/app/build/outputs/apk/release/*.apk"
          name: Release ${{ github.ref_name }}
          body: |
            Automated Android release for ${{ github.ref_name }}.

            See CHANGELOG.md for notable changes and docs/RELEASE.md for the release process.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove decoded signing inputs
        if: always()
        run: rm -f "${RUNNER_TEMP}/release_key.jks" app/google-services.json
