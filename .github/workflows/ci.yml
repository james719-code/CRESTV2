name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      component:
        description: Component to validate
        type: choice
        default: all
        options: [all, android, web, backend]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
      web: ${{ steps.changes.outputs.web }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test file-change routing
        run: node --test scripts/ci/*.test.mjs
      - name: Select checks
        id: changes
        run: node scripts/ci/detect-changes.mjs

  android:
    name: Unit tests and debug build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Create placeholder Firebase config
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "crest-ci",
              "storage_bucket": "crest-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.bdbshs.crest"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Make Gradle wrapper executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Validate
        run: ./gradlew --stacktrace -PSTORAGE_PROVIDER=disabled testDebugUnitTest assembleDebug

  web:
    name: Web build and tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend security checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install security test dependencies
        run: npm ci --prefix frontend
      - name: Check Edge Function types
        run: deno check --config supabase/functions/deno.json supabase/functions/crest-storage/index.ts supabase/functions/crest-notifications/index.ts
      - name: Test Firestore rules without production credentials
        run: npx --yes firebase-tools@15.15.0 emulators:exec --only firestore --project demo-crest "npm --prefix frontend run test:rules"

  required:
    name: CI passed
    needs: [changes, android, web, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks for every changed component
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS)
          if (results.changes.result !== 'success') process.exit(1)
          for (const component of ['android', 'web', 'backend']) {
            const expected = results.changes.outputs[component] === 'true'
            const result = results[component].result
            if ((expected && result !== 'success') || (!expected && result !== 'skipped')) {
              console.error(`${component}: unexpected result ${result}`)
              process.exit(1)
            }
          }
          console.log('All required component checks passed; unaffected builds were skipped.')
          NODE
